      "passage": "　　以前在東海的時候，說也奇怪，明明該有很多事要做，但總覺得時間真是多，多到沒處殺，長日漫漫，閒坐桌前，這時最易泛起一股想要吃冰淇淋的欲望。\n\n　　我常去的那家冰淇淋專賣店就在兩條馬路的交叉轉角，店面不大，前面有綠色的花圃，瘦瘦的幾根路樹，葉子並不多。冰淇淋店亮晶晶的櫥窗十分可愛，外面裝飾得像城堡一樣，非常合我的心意，裡面賣的冰淇淋口味雖不甚多，但也有二、三十種，將它們互相搭配組合起來就千變萬化了。那時往往一坐就是一下午，感到外面世界的奔忙都被融化在湯匙底下，自己停格在喧囂城市的某個角落。\n\n　　回台北以後則正好相反，分明無啥正事要做，可卻每天忙得不得了，不過我偶爾還是得偷空去一幢奶油色的二樓小鋪吃上一杯，像是一種信仰，並為之醺然、陶然而茫然。<hl-g>吃冰淇淋要有一點小小的童趣，要暫時放下成人世界裡的一些禮儀</hl-g>，比如說手指沾上了冰淇淋，你如果就拿了一旁的餐紙去擦，那就喪失了這種樂趣，非用嘴吮不可；又譬如說你吃得太慢，許多冰淇淋融成液狀流於杯底，那平口匙是絕對撈不起來的，這時為了不暴殄天物，你也不用不好意思，<hl-g>儘管伸長舌頭去舔</hl-g>，這樣才能享受那種快樂，得到那層滋味。\n\n　　所以在我來說，無論是那家轉角的冰淇淋店，或是奶油色的二樓小鋪，其實都有一層童話的色彩，走進其中，就好像進入了<hl-y>童戈利先生的巷子</hl-y>，裡面是<hl-g>旋轉馬的搖鈴聲與神奇的廚師</hl-g>，為你帶來一晌的歡樂與無憂。所以冰淇淋店是最好的約會場所，在奇幻而純真的冰淇淋世界裡，就像魔法，約會的兩人將會看到真正的彼此，更重要的，當你提出想嘗一嘗她的冰淇淋口味而又沒有遭到拒絕時，那表示像王子或是公主那樣，你可以輕輕吻她，並且乘著金馬車向你的王國駛去。這是冰淇淋的王國，無憂的世界。只可惜誰都無法長留，有如童年一般，穿過街角就長大，再回頭什麼也找不到。\n\n　　最近最後一次去冰淇淋店已是數月以前，美好的週末下午，陽光融融，妻子穿著美麗的花裙與輕巧的便鞋，人潮擁擠，等待的隊伍很長，午后的時光變得焦躁了起來，而我們居然幸運地坐到了窗邊的位置，窗外的綠樹正開黃花，冰淇淋也相同的沁涼，然而我們卻越坐越感到不安，馬路上穿流的車潮，室內震耳的喧譁，像是一座陷落在搖滾樂團手中的古堡，正商量著入夜後的慶功，旁邊的人不是在品嘗冰淇淋，而是在急切地推銷一種商品，或是努力說服別人購買一種服務，我們終是黯然地離開了那小小的窗邊，像遺失了往下一站的車票一般，心情不知放在哪裡才好。<hl-y>之後我們就真的長大了</hl-y>，<hl-g>很在乎生命裡的得失，而不是喜悅</hl-g>。\n(節錄自徐國能《街角的冰淇淋小店》)\n\n注釋：①童戈利先生的巷子：英國童話保母包萍中一條只能偶爾闖入，但無法在現實中找到的魔法小巷。",

                    {isSubmitted && (
                        <div className="mb-6 bg-gradient-to-r from-teal-50 to-emerald-50 p-5 rounded-2xl border border-teal-200 text-center animate-fade-in shadow-inner">
                            <h3 className="text-lg font-black text-teal-900 mb-1">🎉 測驗結果出爐</h3>
                            <p className="text-gray-700 font-medium">
                                選擇題共 {choiceScore.total} 題，答對 <span className="text-emerald-600 font-black text-3xl mx-1">{choiceScore.score}</span> 題 
                                （得分：<span className="text-emerald-700 font-black text-3xl mx-1">{choiceScore.score * 2}</span> / {choiceScore.total * 2} 分）
                            </p>
                            <p className="text-xs text-gray-500 mt-2">（國字注音與默寫等非選擇題請核對下方正解與詳解）</p>
                        </div>
                    )}

                    <div className="space-y-6">
                        {sections.map((sec, idx) => (
                            <div key={idx}>
                                <h3 className="font-bold text-gray-700 mb-3 border-l-4 border-teal-600 pl-2.5 text-sm sm:text-base">
                                    {sec.title}
                                </h3>
                                <div className="flex flex-wrap gap-2 sm:gap-2.5">
                                    {sec.range.map(item => (
                                        <button 
                                            key={item.scrollId} 
                                            onClick={() => onSelect(item.scrollId)}
                                            className={item.type === 'manual' 
                                                ? "w-10 h-10 rounded-full bg-gray-100 text-gray-600 font-bold hover:bg-teal-100 hover:text-teal-800 transition-all shadow-xs flex items-center justify-center text-sm border border-gray-200" 
                                                : getButtonClass(item.id, item.correct)}
                                            title={`跳轉到第 ${item.display} 題`}
                                        >
                                            {item.display}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const QuestionCard = ({ id, data, scrollId, userAnswers, onAnswerSelect, isSubmitted, showAllAnswers }) => {
            const [showAnswer, setShowAnswer] = useState(false);
            const finalScrollId = scrollId || `q-${id}`;
            const isChoice = !!data.options;
            const currentAnswer = userAnswers[id];

            const getOptionClass = (option) => {
                const pureOption = option.replace(/<hl-[yg]>/g, '').replace(/<\/hl-[yg]>/g, '');
                const baseClass = "p-3.5 rounded-xl border transition-all cursor-pointer text-left text-sm sm:text-base leading-relaxed ";
                if (!isSubmitted) {
                    if (currentAnswer === pureOption) return baseClass + "bg-teal-50 border-teal-500 text-teal-900 font-bold shadow-sm ring-2 ring-teal-200";
                    return baseClass + "bg-white border-gray-200 hover:bg-gray-50 text-gray-700 hover:border-gray-300";
                } else {
                    const isCorrect = pureOption.startsWith(data.a);
                    if (isCorrect) return baseClass + "bg-emerald-50 border-emerald-500 text-emerald-900 font-black ring-2 ring-emerald-300";
                    if (currentAnswer === pureOption && !isCorrect) return baseClass + "bg-rose-50 border-rose-500 text-rose-900 font-bold ring-2 ring-rose-200";
                    return baseClass + "bg-gray-50 border-gray-100 text-gray-400 opacity-70";
                }
            };

            useEffect(() => {
                if (showAllAnswers) setShowAnswer(true);
                else if (isSubmitted && isChoice) {
                    const pureCurrentAns = currentAnswer ? currentAnswer.replace(/<hl-[yg]>/g, '').replace(/<\/hl-[yg]>/g, '') : null;
                    const isCorrect = pureCurrentAns && pureCurrentAns.startsWith(data.a);
                    if (!isCorrect) setShowAnswer(true);
                }
            }, [isSubmitted, showAllAnswers, isChoice, currentAnswer, data.a]);

            return (
                <div id={finalScrollId} className="bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow border border-gray-200 overflow-hidden scroll-mt-32">
                    <div className="p-5 sm:p-6">
                        <div className="flex items-center justify-between mb-3.5">
                            <span className="inline-flex items-center space-x-1.5 bg-teal-50 text-teal-800 text-xs sm:text-sm px-3 py-1 rounded-full font-bold border border-teal-200">
                                <span>第 {id.replace(/^[pd]-/, '')} 題</span>
                                {data.type && <span className="text-teal-600 font-normal">| {data.type}</span>}
                            </span>
                            {isChoice && !isSubmitted && currentAnswer && (
                                <span className="text-xs text-emerald-700 font-bold bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                                    ✓ 已選
                                </span>
                            )}
                        </div>

                        <div className="text-base sm:text-lg text-gray-800 mb-5 font-medium leading-relaxed">
                            {data.answers 
                                ? <div className="whitespace-pre-line serif" dangerouslySetInnerHTML={createMarkup(data.text, showAnswer)} /> 
                                : <div dangerouslySetInnerHTML={createMarkup(data.q, showAnswer)} />
                            }
                        </div>

                        {data.options && (
                            <div className="space-y-2.5 mb-5">
                                {data.options.map((opt, i) => {
                                    const pureOpt = opt.replace(/<hl-[yg]>/g, '').replace(/<\/hl-[yg]>/g, '');
                                    return (
                                        <button 
                                            key={i} 
                                            onClick={() => !isSubmitted && onAnswerSelect(id, pureOpt)} 
                                            disabled={isSubmitted} 
                                            className={`w-full ${getOptionClass(opt)}`}
                                        >
                                            <span dangerouslySetInnerHTML={createMarkup(opt, showAnswer)} />
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        <div className="border-t border-gray-100 pt-4">
                            <button 
                                onClick={() => setShowAnswer(!showAnswer)} 
                                className={`text-xs sm:text-sm font-bold px-4 py-2 rounded-xl transition-all flex items-center space-x-1.5 ${showAnswer ? "bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200" : "bg-teal-50 text-teal-700 hover:bg-teal-100 border border-teal-200"}`}
                            >
                                <span>{showAnswer ? "🙈 隱藏詳解與畫記" : "💡 查看詳解與雙色螢光筆"}</span>
                            </button>

                            {showAnswer && (
                                <div className="mt-4 bg-gradient-to-br from-slate-50 to-emerald-50/30 p-4 sm:p-5 rounded-xl border border-teal-100 animate-fade-in space-y-2.5">
                                    <div className="flex items-center">
                                        <span className="font-black text-rose-600 mr-2 text-sm sm:text-base">【正解】</span>
                                        <span 
                                            className="text-lg sm:text-xl font-black text-gray-900" 
                                            dangerouslySetInnerHTML={createMarkup(data.a || data.answers.map((ans, i) => `(${i+1}) ${ans}`).join('　'), true)} 
                                        />
                                    </div>
                                    <div className="text-gray-700 text-sm sm:text-base leading-relaxed whitespace-pre-line border-t border-gray-200/60 pt-2.5">
                                        <span className="font-bold text-gray-500 text-xs sm:text-sm block mb-1">【解析說明】</span>
                                        <span dangerouslySetInnerHTML={createMarkup(data.exp, true)} />
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ReadingGroup = ({ group, userAnswers, onAnswerSelect, isSubmitted, showAllAnswers }) => {
            const [showTrans, setShowTrans] = useState(false);
            const [showHighlights, setShowHighlights] = useState(false);
            
            useEffect(() => { 
                if (showAllAnswers) {
                    setShowTrans(true);
                    setShowHighlights(true);
                }
            }, [showAllAnswers]);

            return (
                <div className="bg-emerald-50/40 rounded-3xl p-5 sm:p-7 border border-teal-200 shadow-sm space-y-6">
                    <div className="flex flex-wrap items-center justify-between gap-3 border-b border-teal-200/80 pb-3">
                        <h4 className="font-black text-lg sm:text-xl text-teal-900">
                            {group.title}
                        </h4>
                        <div className="flex flex-wrap gap-2">
                            <button 
                                onClick={() => setShowHighlights(!showHighlights)} 
                                className="text-xs sm:text-sm bg-amber-500 text-white px-3.5 py-1.5 rounded-full hover:bg-amber-600 transition-all shadow-sm font-bold flex items-center space-x-1"
                            >
                                <span>{showHighlights ? "隱藏文章畫記" : "🖍️ 顯示文章畫記"}</span>
                            </button>
                            {group.trans && (
                                <button 
                                    onClick={() => setShowTrans(!showTrans)} 
                                    className="text-xs sm:text-sm bg-indigo-600 text-white px-3.5 py-1.5 rounded-full hover:bg-indigo-700 transition-all shadow-sm font-bold flex items-center space-x-1"
                                >
                                    <span>{showTrans ? "隱藏白話翻譯" : "📜 白話文翻譯"}</span>
                                </button>
                            )}
                        </div>
                    </div>

                    <div 
                        className="bg-white p-5 sm:p-6 rounded-2xl shadow-inner text-gray-800 text-sm sm:text-base leading-relaxed whitespace-pre-line serif border border-teal-100"
                        dangerouslySetInnerHTML={createMarkup(group.passage, showHighlights)} 
                    />
                         
                    {group.trans && showTrans && (
                        <div className="bg-amber-50/90 p-5 rounded-2xl border border-amber-200 text-amber-950 text-sm sm:text-base leading-relaxed whitespace-pre-line animate-fade-in shadow-xs">
                            <div className="font-bold text-amber-800 text-xs sm:text-sm mb-2 flex items-center space-x-1">
                                <span>📖</span> <span>白話語譯與背景說明：</span>
                            </div>
                            {group.trans}
                        </div>
                    )}

                    <div className="space-y-6 pt-2">
                        {group.questions.map(q => (
                            <QuestionCard 
                                key={q.id} 
                                id={q.id} 
                                data={q} 
                                userAnswers={userAnswers} 
                                onAnswerSelect={onAnswerSelect} 
                                isSubmitted={isSubmitted} 
                                showAllAnswers={showAllAnswers} 
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [userAnswers, setUserAnswers] = useState({});
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [showAllAnswers, setShowAllAnswers] = useState(false);

            const handleAnswerSelect = (questionId, answer) => {
                setUserAnswers(prev => ({ ...prev, [questionId]: answer }));
            };

            const handleSubmit = () => {
                if (confirm("確定要交卷嗎？交卷後將無法修改答案，並會立刻顯示您的選擇題得分與全卷試題解析！")) {
                    setIsSubmitted(true);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const handleShowAllAnswers = () => {
                if (confirm("確定要開啟全詳解模式嗎？這將會直接展開所有試題的答案、詳細解析與雙色螢光筆畫記！")) {
                    setShowAllAnswers(true);
                }
            };

            const scrollToQuestion = (scrollId) => {
                const el = document.getElementById(scrollId);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };

            return (
                <div className="min-h-screen pb-20 font-sans bg-[#f7fcf8]">
                    {/* 頁首 Header：縮小高度、精緻一行顯示 */}
                    <header className="bg-gradient-to-r from-teal-800 via-emerald-700 to-teal-900 text-white py-3 sm:py-3.5 shadow-md mb-6 sticky top-0 z-50 border-b-2 border-amber-400">
                        <div className="max-w-4xl mx-auto px-4 flex items-center justify-center flex-wrap gap-x-3 gap-y-1 text-center">
                            <span className="bg-teal-900/80 border border-teal-400/50 text-teal-200 text-xs sm:text-sm font-bold px-3 py-0.5 rounded-full">
                                臺北市立龍門國中・114學年度七下・第三次段考
                            </span>
                            <h1 className="text-base sm:text-xl font-black tracking-wide text-white">
                                國文科試題詳解雙色螢光筆版
                            </h1>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 space-y-8">
                        {/* 左右開弓必勝技元件 */}
                        <StudyMethodGuide />

                        {/* 試題選單與進度 */}
                        <Menu 
                            onSelect={scrollToQuestion} 
                            userAnswers={userAnswers} 
                            isSubmitted={isSubmitted} 
                            onShowAllAnswers={handleShowAllAnswers} 
                        />

                        {/* 題目主區域 */}
                        <div className="space-y-10">
                            {/* 一、國字注音 */}
                            {EXAM_DATA.phonetic && EXAM_DATA.phonetic.length > 0 && (
                                <section className="space-y-4">
                                    <h3 className="text-xl sm:text-2xl font-black text-gray-800 border-l-4 border-teal-600 pl-3">
                                        一、國字注音（每題 1 分，共 18 分）
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {EXAM_DATA.phonetic.map(q => (
                                            <QuestionCard 
                                                key={q.id} 
                                                id={q.id} 
                                                data={q} 
                                                userAnswers={{}} 
                                                onAnswerSelect={() => {}} 
                                                isSubmitted={false} 
                                                showAllAnswers={showAllAnswers} 
                                            />
                                        ))}
                                    </div>
                                </section>
                            )}

                            {/* 二、原文默寫 */}
                            {EXAM_DATA.dictation && EXAM_DATA.dictation.length > 0 && (
                                <section className="space-y-4">
                                    <h3 className="text-xl sm:text-2xl font-black text-gray-800 border-l-4 border-teal-600 pl-3">
                                        二、原文默寫（每格 2 分，共 8 分）
                                    </h3>
                                    <div className="space-y-4">
                                        {EXAM_DATA.dictation.map(q => (
                                            <QuestionCard 
                                                key={q.id} 
                                                id={q.id} 
                                                data={q} 
                                                userAnswers={{}} 
                                                onAnswerSelect={() => {}} 
                                                isSubmitted={false} 
                                                showAllAnswers={showAllAnswers} 
                                            />
                                        ))}
                                    </div>
                                </section>
                            )}

                            {/* 三、成語測驗 */}
                            {EXAM_DATA.idioms && EXAM_DATA.idioms.length > 0 && (
                                <section className="space-y-4">
                                    <h3 className="text-xl sm:text-2xl font-black text-gray-800 border-l-4 border-teal-600 pl-3">
                                        三、成語測驗（每題 2 分，共 10 分）
                                    </h3>
                                    <div className="space-y-5">
                                        {EXAM_DATA.idioms.map(q => (
                                            <QuestionCard 
                                                key={q.id} 
                                                id={q.id} 
                                                scrollId={`q-idiom-${q.id}`} 
                                                data={q} 
                                                userAnswers={userAnswers} 
                                                onAnswerSelect={handleAnswerSelect} 
                                                isSubmitted={isSubmitted} 
                                                showAllAnswers={showAllAnswers} 
                                            />
                                        ))}
                                    </div>
                                </section>
                            )}

                            {/* 四、單選題 */}
                            {EXAM_DATA.single && EXAM_DATA.single.length > 0 && (
                                <section className="space-y-4">
                                    <h3 className="text-xl sm:text-2xl font-black text-gray-800 border-l-4 border-teal-600 pl-3">
                                        四、單選題（第 6～28 題，每題 2 分，共 46 分）
                                    </h3>
                                    <div className="space-y-5">
                                        {EXAM_DATA.single.map(q => (
                                            <QuestionCard 
                                                key={q.id} 
                                                id={q.id} 
                                                data={q} 
                                                userAnswers={userAnswers} 
                                                onAnswerSelect={handleAnswerSelect} 
                                                isSubmitted={isSubmitted} 
                                                showAllAnswers={showAllAnswers} 
                                            />
                                        ))}
                                    </div>
                                </section>
                            )}

                            {/* 五、閱讀題組 */}
                            {EXAM_DATA.reading && EXAM_DATA.reading.length > 0 && (
                                <section className="space-y-6">
                                    <h3 className="text-xl sm:text-2xl font-black text-gray-800 border-l-4 border-teal-600 pl-3">
                                        五、閱讀題組（第 29～37 題，每題 2 分，共 18 分）
                                    </h3>
                                    <div className="space-y-8">
                                        {EXAM_DATA.reading.map((group, idx) => (
                                            <ReadingGroup 
                                                key={idx} 
                                                group={group} 
                                                userAnswers={userAnswers} 
                                                onAnswerSelect={handleAnswerSelect} 
                                                isSubmitted={isSubmitted} 
                                                showAllAnswers={showAllAnswers} 
                                            />
                                        ))}
                                    </div>
                                </section>
                            )}
                        </div>

                        {/* 底部大交卷按鈕 */}
                        {!isSubmitted && !showAllAnswers && (
                            <div className="flex justify-center py-10">
                                <button 
                                    onClick={handleSubmit} 
                                    className="bg-gradient-to-r from-teal-600 via-emerald-600 to-teal-700 text-white font-black text-xl sm:text-2xl px-12 sm:px-16 py-4 sm:py-5 rounded-full shadow-2xl hover:from-teal-700 hover:to-emerald-700 transform hover:scale-105 transition-all ring-4 ring-emerald-300 animate-bounce"
                                >
                                    ✍️ 交卷看成績與詳解
                                </button>
                            </div>
                        )}
                    </main>

                    {/* 浮動按鈕：回選單 */}
                    <button 
                        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} 
                        className="fixed bottom-8 right-8 bg-teal-700 text-white font-bold px-5 py-3 rounded-full shadow-2xl hover:bg-teal-800 transition-all flex items-center space-x-2 z-50 border-2 border-white hover:-translate-y-1"
                        title="回選單頂端"
                    >
                        <span>⬆️ 回選單</span>
                    </button>

                    {/* 頁尾 Footer */}
                    <footer className="mt-24 py-12 bg-gradient-to-r from-teal-800 via-emerald-900 to-teal-950 text-white text-center space-y-3 border-t-4 border-amber-400">
                        <p className="text-xl sm:text-2xl font-black text-yellow-300 tracking-wider">
                            只要有心，人人都是國文神！
                        </p>
                        <p className="text-sm text-teal-200 opacity-90 font-medium">
                            𖤐 本網頁由 Gemini 生成 • 龍門國中黃于珊、王斐亭老師製作 𖤐
                        </p>
                        <p className="text-xs text-teal-300/70">
                            學思軒國文教室版權所有 • 左右開弓全腦高效學習法
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

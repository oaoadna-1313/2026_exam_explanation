            "passage": "人生總是充滿了偶然與巧合，從學齡前到今天，我不擅長人際社交。在口語表達上也有一定程度的困難，選擇從事旅遊業，甚至後來因緣際會踏入媒體圈，都是始料未及的人生轉變。\n我和大部分的年輕朋友一樣，沒有太多預算讓自己一直出去旅行，旅行業的工作是我少數可以不停移動的機會。即使如此，心中一定牢記：「終究，旅遊業是服務業，無論你身在何方，出門在外，永遠有職務在身。」\n從事旅遊業，絕對和自己出外旅行不一樣。但對我而言，至少是一份可以越過國境的工作，<hl-g>①離開就好，只要不是這裡</hl-g>。況且，旅遊業的菁英人才，確實能在短時間擁有高收入。有許多的原因，讓我決定去克服自己在人際與表述方面的阻礙，克服專業的門檻，換得一次又一次的出發。\n第一次出團時，業務與團務主管把我叫到桌前，告訴我：「工作上，最重要的就是人。」她說：「出國旅遊，如果都是高端的服務設定，搭乘頭等或商務客艙，入住五星級精品旅店、三餐都是米其林等級高級料理，旅客只要願意支付同等的代價，領隊的存在感其實很薄弱。但許多人出門，要的不見得是高級享受，更多的旅客是捉襟見肘、省吃儉用了好幾年，才能支付團費出國旅遊。他們需要的是美好回憶，更甚於食宿的硬體享受。」\n最後，她語重心長地告訴我：「<hl-g>②領隊的工作就是為他們一生一世的回憶負責</hl-g>。」這段話在我心中盤桓許久。然而，往後的十多年，卻在在證明著這一句話。因此不論在演講上或是對工作的態度，我都不曾離開她的指導。\n我第一次帶團出國，團員反應平平。因為在此之前，我沒跟過觀光團，即使出門前主管不停地耳提面命，對於領隊要做些什麼事，只有模糊的梗概。逐一檢查客房、注意行李出入，這只是基本的領隊常識，但是，關於如何掌控旅客體力，從舉手投足去觀察旅客情緒、如何補足行程銜接的時間差、用餐上菜時的溫度與節奏、何時入住飯店、入住手續辦理後的種種瑣事……魔鬼藏在細節裡，只有透過實務操作，才能細細體會箇中玄機。首次出團的悲慘經驗，至今仍歷歷在目，只有失敗的經驗，才讓人成長。\n在工作的過程裡，很重要的是觀察其他人如何工作。然而旅遊業不一樣，我有機會接觸到不同屬性的旅客，這是很好的磨鍊。剛入旅遊業時，第一份正式職位是直客業務，但對於業務實際的工作內容，絲毫沒有任何概念，於是，自己就印一大疊宣傳單到處去發。只要客人有任何需要，哪怕他是住在偏鄉僻壤，只是要辦證件出國，我也不辭風雨騎著摩托車去收送件。當時還有位報名的團員，告訴我過了凌晨一點才有空，要我半夜兩點再過去收件，我也是西裝革履地前往收件。總之，無論客戶的要求是什麼，使命必達。\n有一年，一群來自屏東的大家族要去普吉島。原因很有趣，是因為家族裡最年長的爺爺之前看了詹姆斯·龐德的系列電影金槍人（The Man with the Golden Gun, 1974），其中有幕場景就是在此島外攀牙灣的達鋪島（Tapoo）所拍攝，當年看過電影之後，爺爺對攀牙灣始終心心念念，希望自己有朝一日能夠親臨現場。就這樣，一直抱著夢想，後來年紀大了，身體差了，奶奶也先他而去，八十幾歲了卻還是忘不了，家族的孩子們，決定實現爺爺這個願望。\n我不知道，爺爺為什麼對○○七或攀牙灣有如此強烈的浪漫幻想，也不知道為什麼以普吉島這樣還算短程的地方，爺爺過了這麼久才起心動念。但我很慶幸陪伴了這一趟旅程，見證家族圓夢的時刻——爺爺實現了到攀牙灣的夢想，孩子們實現了讓自己父親願望成真的夢想。旅遊回來後兩年，爺爺過世了，他們家人特意打電話告訴我，謝謝我企畫及帶領家族旅行，爺爺直到過世前，都還記得他們全家人最後一次出國旅遊的種種。\n我所承接的一次工作，成為了別人一生的回憶。\n掛上電話的那一刻，我止不住眼淚，當下我找到自己在旅遊業的意義與價值。<hl-g>③我很榮幸在別人的記憶中有立錐之地，沒有虛擲家族的時間</hl-g>。也更讓我覺得，或許自己的人生，有一部分就是為了要創造他人的回憶與幸福。\n這是旅遊業的核心價值——<hl-g>④每個領隊手上捧的，腳下踩的，都是別人的夢</hl-g>。\n——謝哲青〈<hl-g>一園人生</hl-g>〉",

            "title": "題組三：琦君〈柚子碗、盒及其他〉",
            "passage": "現代人凡是能夠過簡樸日子的，都要說一句「你丟我撿」。撿起廢物，可以利用來做出各種實用東西，既省了錢，又可享受創造過程中的無限樂趣。\n我母親這位老式的農村婦女，可說是充分發揮了「你丟我撿」的簡省美德的。任何破爛無用之物，她都能化腐朽為神奇，把它們變成家庭不可缺少的用具，或是小玩意，或是小女孩的飾物。母親年輕時一雙十指尖尖的蘭花手，到老來儘管粗糙多皺又多裂，卻也是一雙會變戲法的魔術手呢！\n現就記憶中略舉幾樣來說說：\n〈柚子碗、盒〉\n家鄉秋來的柚子是非常肥碩的。柚子成熟時，村裡孩子們都用竹竿敲打，柚子紛紛落地，大家都吃得胃冒酸水了。母親卻吩咐大一點的孩子，爬上樹上，揀那些圓鼓鼓長得勻稱的，小心摘下來，放在籃子裡，用繩子垂下來，這樣柚子就不會跌傷，因為母親是要拿柚子皮做容器的。\n她先用刀在柚子齊腰之處，輕輕畫一圈，要瞄得很準，不偏不倚，兜過來剛剛連成像地球赤道似的一條線。剝功也很重要，不能性急，要慢慢兒用指甲把皮挑開一點，再用大拇指伸入，輕輕地繞著割縫一圈圈愈轉愈深，直到蒂頭之處，雙手捧著一轉，皮就完整地脫落下來了。趁著新鮮柔軟時，以大小適合的碗套入，一蓋一底。碗不能太小，以免皮乾了會皺。也不能太大，以免皮會繃破，要恰到好處。放在通風之處吹乾，不能曬，曬了皮就變黑，香味也跑了。直等乾透以後，將碗脫下，就成了兩個玲瓏的柚子碗，合在一起就是柚子盒了。\n柚子盒非常清香。外公拿它裝旱菸，菸絲也會透著一股柚子香。我呢？拿它裝花生米，端著邊走邊吃，比放在口袋裡弄得一袋的花生皮好得多。母親用一個個柚子碗裝糖果素點供佛。真個是發揮了百寶盒的用途呢。\n——節選自琦君〈<hl-g>柚子碗、盒及其他</hl-g>〉",

                            {data.answers 
                                ? <div className="whitespace-pre-line bg-gray-50 p-4 rounded-xl border border-gray-200 leading-loose" dangerouslySetInnerHTML={{__html: createMarkup(data.text, showAnswer).__html}} /> 
                                : <div className="leading-loose" dangerouslySetInnerHTML={{__html: createMarkup(data.q, showAnswer).__html}} />
                            }
                        </div>

                        {/* 選擇題選項 */}
                        {data.options && (
                            <div className="space-y-3 mb-6">
                                {data.options.map((opt, i) => {
                                    const pureOpt = opt.replace(/<hl-[yg]>/g, '').replace(/<\/hl-[yg]>/g, '');
                                    return (
                                        <button 
                                            key={i} 
                                            onClick={() => !isSubmitted && onAnswerSelect(id, pureOpt)} 
                                            disabled={isSubmitted} 
                                            className={`w-full ${getOptionClass(opt)}`}
                                        >
                                            <span dangerouslySetInnerHTML={{__html: createMarkup(opt, showAnswer).__html}} />
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        {/* 詳解切換按鈕與解析區塊 */}
                        <div className="border-t border-gray-100 pt-4">
                            <button 
                                onClick={() => setShowAnswer(!showAnswer)} 
                                className={`flex items-center space-x-2 px-4 py-2 rounded-xl font-bold transition-all shadow-sm ${showAnswer ? "bg-red-50 text-red-700 hover:bg-red-100 border border-red-200" : "bg-teal-50 text-teal-700 hover:bg-teal-100 border border-teal-200"}`}
                            >
                                <span>{showAnswer ? "🙈 隱藏詳解" : "📖 查看詳解與螢光筆畫記"}</span>
                            </button>

                            {showAnswer && (
                                <div className="mt-4 bg-gradient-to-br from-emerald-50/60 to-teal-50/60 p-5 rounded-xl border-2 border-teal-200 animate-fade-in shadow-inner">
                                    <div className="flex items-center mb-3">
                                        <span className="font-black text-red-600 mr-2 text-base">【正解】：</span>
                                        <span className="text-xl font-black text-gray-900 bg-white px-3 py-1 rounded-lg border border-teal-200 shadow-sm" 
                                              dangerouslySetInnerHTML={{__html: createMarkup(data.a || (data.answers && data.answers.join(' ')), true).__html}} />
                                    </div>
                                    <div className="text-gray-800 leading-loose whitespace-pre-line text-sm sm:text-base">
                                        <span className="font-bold text-teal-800 block mb-1">【詳細解析與語意說明】：</span>
                                        <span dangerouslySetInnerHTML={{__html: createMarkup(data.exp, true).__html}} />
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 閱讀題組卡片元件 ---
        const ReadingGroup = ({ group, userAnswers, onAnswerSelect, isSubmitted, showAllAnswers }) => {
            const [showTrans, setShowTrans] = useState(false);
            const [showHighlights, setShowHighlights] = useState(false);
            
            useEffect(() => { 
                if (showAllAnswers) {
                    setShowTrans(true);
                    setShowHighlights(true);
                }
            }, [showAllAnswers]);

            return (
                <div className="bg-gradient-to-b from-gray-50 to-white rounded-3xl p-6 sm:p-8 border-2 border-teal-200 shadow-lg space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-200 pb-4">
                        <h4 className="font-black text-xl text-teal-950 flex items-center gap-2">
                            <span>📚</span>
                            <span>{group.title}</span>
                        </h4>
                        
                        <div className="flex flex-wrap gap-2">
                            <button 
                                onClick={() => setShowHighlights(!showHighlights)} 
                                className={`text-xs sm:text-sm px-4 py-2 rounded-full font-bold transition-all shadow-md flex items-center gap-1.5 ${showHighlights ? "bg-amber-600 text-white hover:bg-amber-700" : "bg-amber-500 text-white hover:bg-amber-600"}`}
                            >
                                <span>🖍️</span>
                                <span>{showHighlights ? "隱藏文章雙色畫記" : "顯示文章雙色畫記"}</span>
                            </button>
                            {group.trans && (
                                <button 
                                    onClick={() => setShowTrans(!showTrans)} 
                                    className={`text-xs sm:text-sm px-4 py-2 rounded-full font-bold transition-all shadow-md flex items-center gap-1.5 ${showTrans ? "bg-indigo-700 text-white hover:bg-indigo-800" : "bg-indigo-600 text-white hover:bg-indigo-700"}`}
                                >
                                    <span>🌐</span>
                                    <span>{showTrans ? "隱藏白話文翻譯" : "顯示文言白話翻譯"}</span>
                                </button>
                            )}
                        </div>
                    </div>

                    {/* 文本原文 */}
                    <div 
                        className="bg-white p-6 sm:p-8 rounded-2xl shadow-inner border border-gray-200 text-gray-800 leading-loose whitespace-pre-line serif text-base sm:text-lg"
                        dangerouslySetInnerHTML={{__html: createMarkup(group.passage, showHighlights).__html}} 
                    />
                         
                    {/* 白話文翻譯 */}
                    {group.trans && showTrans && (
                        <div className="animate-fade-in">
                            <div className="bg-amber-50/90 p-6 rounded-2xl border-2 border-amber-300 text-gray-800 text-sm sm:text-base leading-loose whitespace-pre-line shadow-sm">
                                <div className="font-black text-amber-900 mb-2 flex items-center gap-1.5">
                                    <span>📜</span>
                                    <span>【白話文流暢翻譯對照】：</span>
                                </div>
                                {group.trans}
                            </div>
                        </div>
                    )}

                    {/* 題組題目列表 */}
                    <div className="space-y-6 pt-4">
                        {group.questions.map(q => (
                            <QuestionCard 
                                key={q.id} 
                                id={q.id} 
                                data={q} 
                                userAnswers={userAnswers} 
                                onAnswerSelect={onAnswerSelect} 
                                isSubmitted={isSubmitted} 
                                showAllAnswers={showAllAnswers} 
                            />
                        ))}
                    </div>
                </div>
            );
        };

        // --- 主應用程式 App ---
        const App = () => {
            const [userAnswers, setUserAnswers] = useState({});
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [showAllAnswers, setShowAllAnswers] = useState(false);

            const handleAnswerSelect = (questionId, answer) => {
                setUserAnswers(prev => ({ ...prev, [questionId]: answer }));
            };

            const handleSubmit = () => {
                if (confirm("確定要交卷嗎？交卷後將會核算成績並顯示詳細解析與錯題訂正。")) {
                    setIsSubmitted(true);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const handleShowAllAnswers = () => {
                if (confirm("確定要顯示所有題目的詳解與雙色螢光筆畫記嗎？這將直接呈現所有題目的正確答案與完整解析。")) {
                    setShowAllAnswers(true);
                }
            };

            const scrollToQuestion = (scrollId) => {
                const el = document.getElementById(scrollId);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };

            return (
                <div className="min-h-screen pb-24 font-sans bg-[#f4fbf7]">
                    
                    {/* 頁首標題 Header - 縮小高度、一行顯示 */}
                    <header className="bg-gradient-to-r from-teal-800 via-emerald-700 to-teal-900 text-white py-3 sm:py-3.5 shadow-md mb-6 sticky top-0 z-50 border-b-2 border-amber-400">
                        <div className="max-w-4xl mx-auto px-4 flex items-center justify-center flex-wrap gap-x-3 gap-y-1 text-center">
                            <span className="bg-teal-900/80 border border-teal-400/50 text-teal-200 text-xs sm:text-sm font-bold px-3 py-0.5 rounded-full">
                                龍門國中 115 學年度第一學期 • 第一次定期評量
                            </span>
                            <h1 className="text-base sm:text-xl font-black tracking-wide text-white">
                                八年級國文科試題詳解學習網頁
                            </h1>
                        </div>
                    </header>

                    {/* 主要內容區 */}
                    <main className="max-w-4xl mx-auto px-4 space-y-8">
                        
                        {/* 1. 學思軒必勝技：左右開弓學習法元件 */}
                        <StudyMethodGuide />

                        {/* 2. 試題選單與即時交卷統計 */}
                        <Menu 
                            onSelect={scrollToQuestion} 
                            userAnswers={userAnswers} 
                            isSubmitted={isSubmitted} 
                            onShowAllAnswers={handleShowAllAnswers}
                            showAllAnswers={showAllAnswers}
                        />

                        {/* 3. 試題展示區塊 */}
                        <div className="space-y-10">
                            
                            {/* 一、國字注音 */}
                            {EXAM_DATA.phonetic && EXAM_DATA.phonetic.length > 0 && (
                                <section className="space-y-4">
                                    <div className="flex items-center justify-between border-b-2 border-teal-500 pb-2">
                                        <h3 className="text-xl sm:text-2xl font-black text-teal-900 border-l-4 border-teal-600 pl-3">
                                            一、國字注音（每題1分，共20分）
                                        </h3>
                                        <span className="text-xs bg-teal-100 text-teal-800 font-bold px-2.5 py-1 rounded-lg">非選擇題</span>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {EXAM_DATA.phonetic.map(q => (
                                            <QuestionCard 
                                                key={q.id} 
                                                id={q.id} 
                                                data={q} 
                                                userAnswers={{}} 
                                                onAnswerSelect={()=>{}} 
                                                isSubmitted={false} 
                                                showAllAnswers={showAllAnswers} 
                                            />
                                        ))}
                                    </div>
                                </section>
                            )}

                            {/* 二、配合題 */}
                            {EXAM_DATA.dictation && EXAM_DATA.dictation.length > 0 && (
                                <section className="space-y-4">
                                    <div className="flex items-center justify-between border-b-2 border-teal-500 pb-2">
                                        <h3 className="text-xl sm:text-2xl font-black text-teal-900 border-l-4 border-teal-600 pl-3">
                                            二、配合題：四季詩意判斷（每格1分，共4分）
                                        </h3>
                                        <span className="text-xs bg-teal-100 text-teal-800 font-bold px-2.5 py-1 rounded-lg">手寫配合題</span>
                                    </div>
                                    {EXAM_DATA.dictation.map(q => (
                                        <QuestionCard 
                                            key={q.id} 
                                            id={q.id} 
                                            data={q} 
                                            userAnswers={{}} 
                                            onAnswerSelect={()=>{}} 
                                            isSubmitted={false} 
                                            showAllAnswers={showAllAnswers} 
                                        />
                                    ))}
                                </section>
                            )}

                            {/* 三、成語題 */}
                            {EXAM_DATA.idioms && EXAM_DATA.idioms.length > 0 && (
                                <section className="space-y-4">
                                    <div className="flex items-center justify-between border-b-2 border-teal-500 pb-2">
                                        <h3 className="text-xl sm:text-2xl font-black text-teal-900 border-l-4 border-teal-600 pl-3">
                                            三、成語題：1-5題（一題2分，共10分）
                                        </h3>
                                        <span className="text-xs bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-lg">單一選擇題</span>
                                    </div>
                                    <div className="space-y-6">
                                        {EXAM_DATA.idioms.map(q => (
                                            <QuestionCard 
                                                key={q.id} 
                                                id={q.id} 
                                                scrollId={`q-idiom-${q.id}`} 
                                                data={q} 
                                                userAnswers={userAnswers} 
                                                onAnswerSelect={handleAnswerSelect} 
                                                isSubmitted={isSubmitted} 
                                                showAllAnswers={showAllAnswers} 
                                            />
                                        ))}
                                    </div>
                                </section>
                            )}

                            {/* 四、單題 */}
                            {EXAM_DATA.single && EXAM_DATA.single.length > 0 && (
                                <section className="space-y-4">
                                    <div className="flex items-center justify-between border-b-2 border-teal-500 pb-2">
                                        <h3 className="text-xl sm:text-2xl font-black text-teal-900 border-l-4 border-teal-600 pl-3">
                                            四、單題：6-28題（一題2分，共46分）
                                        </h3>
                                        <span className="text-xs bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-lg">單一選擇題</span>
                                    </div>
                                    <div className="space-y-6">
                                        {EXAM_DATA.single.map(q => (
                                            <QuestionCard 
                                                key={q.id} 
                                                id={q.id} 
                                                data={q} 
                                                userAnswers={userAnswers} 
                                                onAnswerSelect={handleAnswerSelect} 
                                                isSubmitted={isSubmitted} 
                                                showAllAnswers={showAllAnswers} 
                                            />
                                        ))}
                                    </div>
                                </section>
                            )}

                            {/* 五、閱讀題組 */}
                            {EXAM_DATA.reading && EXAM_DATA.reading.length > 0 && (
                                <section className="space-y-6">
                                    <div className="flex items-center justify-between border-b-2 border-teal-500 pb-2">
                                        <h3 className="text-xl sm:text-2xl font-black text-teal-900 border-l-4 border-teal-600 pl-3">
                                            五、閱讀題組：29-38題（一題2分，共20分）
                                        </h3>
                                        <span className="text-xs bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-lg">素養題組</span>
                                    </div>
                                    <div className="space-y-8">
                                        {EXAM_DATA.reading.map((group, idx) => (
                                            <ReadingGroup 
                                                key={idx} 
                                                group={group} 
                                                userAnswers={userAnswers} 
                                                onAnswerSelect={handleAnswerSelect} 
                                                isSubmitted={isSubmitted} 
                                                showAllAnswers={showAllAnswers} 
                                            />
                                        ))}
                                    </div>
                                </section>
                            )}

                        </div>

                        {/* 底部大交卷按鈕 */}
                        {!isSubmitted && !showAllAnswers && (
                            <div className="flex justify-center py-10">
                                <button 
                                    onClick={handleSubmit} 
                                    className="bg-gradient-to-r from-teal-600 via-emerald-600 to-teal-700 text-white font-black text-2xl px-16 py-5 rounded-full shadow-2xl hover:from-teal-700 hover:to-emerald-700 transform hover:scale-105 transition-all ring-4 ring-emerald-300"
                                >
                                    ✍️ 交卷看成績與詳解
                                </button>
                            </div>
                        )}

                    </main>

                    {/* 浮動按鈕：回選單 */}
                    <button 
                        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} 
                        className="fixed bottom-8 right-8 bg-teal-700 text-white font-bold px-5 py-3 rounded-full shadow-2xl hover:bg-teal-800 transition-all flex items-center space-x-2 z-50 border-2 border-white hover:-translate-y-1"
                        title="回選單頂端"
                    >
                        <span>⬆️ 回選單</span>
                    </button>

                    {/* 頁尾 Footer */}
                    <footer className="mt-24 py-12 bg-gradient-to-r from-teal-800 via-emerald-900 to-teal-950 text-white text-center space-y-3 border-t-4 border-amber-400">
                        <p className="text-2xl font-black text-yellow-300 tracking-wider">
                            只要有心，人人都是國文神！
                        </p>
                        <p className="text-sm text-teal-200 opacity-90 font-medium">
                            𖤐 本網頁由 Gemini 生成 • 龍門國中黃于珊、王斐亭老師製作 𖤐
                        </p>
                        <p className="text-xs text-teal-300/70">
                            學思軒國文教室版權所有 • 左右開弓全腦高效學習法
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
